<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiHi 嗨孩</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cr:#F7F3EF;--cr2:#EFE8E0;--cr3:#E5D9CC;
  --pk:#E8C4BB;--pk2:#C9947F;--pk3:#9B6350;
  --br:#6B4C3B;--br2:#3E2A1E;
  --tx:#3E2A1E;--tx2:#7A5C4A;--tx3:#A88B7A;
  --bd:rgba(107,76,59,0.15);--bd2:rgba(107,76,59,0.28);
  --gn:#4A7A50;--gnbg:#EBF4EB;
}
body{background:var(--cr);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:400px;margin:0 auto;}
.topbar{background:var(--cr);border-bottom:1px solid var(--bd2);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
.logo{font-size:14px;font-weight:600;letter-spacing:0.1em;color:var(--br2);}
.logo-s{font-size:9px;letter-spacing:0.22em;color:var(--tx3);}
.cart-btn{display:flex;align-items:center;gap:5px;border:1px solid var(--bd2);border-radius:20px;padding:6px 14px;font-size:11px;background:transparent;color:var(--tx2);cursor:pointer;}
.bdg{background:var(--pk2);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600;}
.promo-bar{background:#FDF0E8;border-bottom:1px solid var(--pk);padding:8px 16px;display:flex;gap:16px;}
.pt{font-size:10px;color:var(--pk3);font-weight:500;}
.body-wrap{display:flex;min-height:calc(100vh - 88px);}
.sb{width:70px;min-width:70px;background:var(--cr2);border-right:1px solid var(--bd);}
.aci{display:flex;flex-direction:column;align-items:center;padding:12px 4px;cursor:pointer;border-right:3px solid transparent;gap:4px;border-bottom:1px solid var(--bd);}
.aci.on{border-right-color:var(--pk2);background:var(--cr);}
.aci span{font-size:9px;color:var(--tx3);}
.aci.on span{color:var(--pk3);font-weight:600;}
.gh{display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;cursor:pointer;border-bottom:1px solid var(--bd);gap:2px;}
.gt{font-size:8px;letter-spacing:0.16em;color:var(--tx3);}
.ga{font-size:10px;color:var(--tx3);transition:transform 0.2s;}
.ga.open{transform:rotate(180deg);}
.gi{overflow:hidden;transition:max-height 0.25s ease;}
.ci{display:flex;flex-direction:column;align-items:center;padding:10px 4px;cursor:pointer;border-right:3px solid transparent;gap:3px;}
.ci.on{border-right-color:var(--pk2);background:var(--cr);}
.ci-i{font-size:13px;color:var(--tx2);}
.ci-l{font-size:9px;color:var(--tx3);text-align:center;line-height:1.3;}
.ci.on .ci-l{color:var(--pk3);font-weight:600;}
.right-area{flex:1;padding:12px 10px;overflow-y:auto;}
.albl{font-size:9px;letter-spacing:0.2em;color:var(--tx3);margin-bottom:10px;display:block;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;}
.cimg{width:100%;aspect-ratio:3/4;background:var(--cr2);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.cimg img{width:100%;height:100%;object-fit:cover;}
.ntag{position:absolute;top:8px;left:8px;background:#FDF0E8;border:1px solid var(--pk);border-radius:10px;padding:2px 8px;font-size:9px;color:var(--pk3);font-weight:600;z-index:1;}
.cb{padding:10px 10px 12px;}
.cbr{font-size:9px;color:var(--tx3);margin-bottom:2px;}
.cnm{font-size:12px;font-weight:600;color:var(--br2);margin-bottom:5px;line-height:1.35;}
.cpr{display:flex;align-items:baseline;gap:5px;}
.cpr-n{font-size:13px;font-weight:600;color:var(--pk3);}
.cpr-o{font-size:10px;color:var(--tx3);text-decoration:line-through;}
.pagination{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;padding:16px 10px;margin-top:8px;}
.pg-btn{border:1px solid var(--bd2);border-radius:8px;padding:7px 12px;font-size:13px;background:transparent;color:var(--tx2);cursor:pointer;min-width:38px;text-align:center;}
.pg-btn:disabled{opacity:0.3;cursor:not-allowed;}
.pg-active{background:var(--br);color:var(--cr)!important;border-color:var(--br);font-weight:600;}
.page{display:none;}.page.active{display:block;}
.dim{width:100%;aspect-ratio:3/4;background:var(--cr2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.dim img{width:100%;height:100%;object-fit:cover;}
.dnb{position:absolute;top:12px;left:12px;background:#FDF0E8;border:1px solid var(--pk);border-radius:10px;padding:3px 10px;font-size:10px;color:var(--pk3);font-weight:600;z-index:1;}
.img-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;}
.img-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.5);cursor:pointer;border:none;}
.img-dot.on{background:#fff;}
.img-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.85);border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;}
.img-nav.prev{left:8px;}.img-nav.next{right:8px;}
.dbody{padding:16px;}
.dbr{font-size:9px;letter-spacing:0.18em;color:var(--tx3);margin-bottom:4px;}
.dnm{font-size:17px;font-weight:600;color:var(--br2);margin-bottom:4px;line-height:1.4;}
.dag{font-size:11px;color:var(--tx3);margin-bottom:8px;}
.dpr{display:flex;align-items:baseline;gap:8px;margin-bottom:16px;}
.dpr-n{font-size:22px;font-weight:600;color:var(--pk3);}
.dpr-o{font-size:14px;color:var(--tx3);text-decoration:line-through;}
.dpr-tag{font-size:10px;color:var(--pk3);background:#FDF0E8;border-radius:6px;padding:2px 8px;font-weight:600;}
.szlbl{font-size:9px;letter-spacing:0.15em;color:var(--tx3);margin-bottom:6px;display:block;}
.szs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.sz{border:1px solid var(--bd2);border-radius:6px;padding:8px 12px;font-size:12px;cursor:pointer;color:var(--tx2);background:transparent;}
.sz.on{background:var(--pk);border-color:var(--pk2);color:var(--pk3);font-weight:600;}
.sz-desc{font-size:10px;color:var(--tx3);margin-bottom:16px;padding:6px 10px;background:var(--cr2);border-radius:6px;line-height:1.7;}
.clbl{font-size:9px;letter-spacing:0.15em;color:var(--tx3);margin-bottom:6px;display:block;}
.cls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.cl{border:1px solid var(--bd2);border-radius:6px;padding:8px 12px;font-size:12px;cursor:pointer;color:var(--tx2);background:transparent;}
.cl.on{background:var(--pk);border-color:var(--pk2);color:var(--pk3);font-weight:600;}
.btnm{width:100%;border:none;border-radius:10px;padding:14px;font-size:13px;font-weight:600;background:var(--br);color:var(--cr);cursor:pointer;letter-spacing:0.1em;margin-bottom:10px;}
.bto{width:100%;border:1px solid var(--bd2);border-radius:10px;padding:13px;font-size:12px;background:transparent;color:var(--tx2);cursor:pointer;margin-bottom:8px;}
.wp{padding:16px;}
.back{display:flex;align-items:center;gap:5px;border:1px solid var(--bd2);border-radius:20px;padding:7px 14px;font-size:11px;background:transparent;color:var(--tx2);cursor:pointer;width:fit-content;margin-bottom:16px;}
.ptit{font-size:14px;font-weight:600;letter-spacing:0.14em;color:var(--br2);margin-bottom:16px;}
.citem{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
.ci-img{width:54px;height:66px;background:var(--cr2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.ci-img img{width:100%;height:100%;object-fit:cover;}
.cbox{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;}
.crow{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);padding:4px 0;}
.cdiv{height:1px;background:var(--bd);margin:10px 0;}
.csub{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;}
.ctot{display:flex;justify-content:space-between;font-size:16px;font-weight:600;color:var(--br2);padding-top:10px;border-top:1px solid var(--bd);margin-top:6px;}
.ctot-a{color:var(--pk3);}
.ship-ok{background:var(--gnbg);border:1px solid #9FC49F;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:11px;color:var(--gn);display:flex;align-items:center;gap:6px;font-weight:600;}
.ship-no{background:var(--cr2);border:1px solid var(--bd2);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:8px;}
.spbar{height:5px;background:var(--cr3);border-radius:4px;flex:1;overflow:hidden;}
.spfill{height:5px;background:var(--pk2);border-radius:4px;}
.osum{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;}
.ost{font-size:9px;letter-spacing:0.18em;color:var(--tx3);margin-bottom:10px;}
.osr{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid var(--bd);}
.osr:last-child{border:none;padding-top:10px;font-size:14px;font-weight:600;color:var(--br2);}
.osa{color:var(--pk3);}
.fg{margin-bottom:12px;}
.fl{font-size:9px;letter-spacing:0.15em;color:var(--tx3);margin-bottom:5px;display:block;}
.fg input{width:100%;border:1px solid var(--bd2);border-radius:10px;padding:11px 14px;font-size:14px;background:#fff;color:var(--tx);font-family:inherit;}
.fg input:focus{outline:none;border-color:var(--pk2);}
.fg input::placeholder{color:var(--tx3);}
.opt-lbl{font-size:9px;color:var(--tx3);margin-left:4px;}
.swp{padding:3rem 1.5rem;text-align:center;}
.sln{width:40px;height:1px;background:var(--pk);margin:0 auto 2rem;}
.sic{font-size:48px;margin-bottom:1rem;}
.sti{font-size:18px;font-weight:600;letter-spacing:0.15em;color:var(--br2);margin-bottom:10px;}
.ssu{font-size:12px;color:var(--tx3);line-height:2;margin-bottom:1.5rem;}
.sno{background:var(--cr2);border-radius:10px;padding:10px 20px;font-size:12px;color:var(--tx2);display:inline-block;margin-bottom:2rem;}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;font-size:12px;color:var(--tx3);}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="logo">HiHi 嗨孩</div>
    <div class="logo-s">質感正韓童裝選品</div>
  </div>
  <button class="cart-btn" onclick="gp('cart')">
    🛒 購物車 <span class="bdg" id="cnt">0</span>
  </button>
</div>

<div class="promo-bar">
  <span class="pt">🏷 新品上市 95折</span>
  <span class="pt">🚚 滿 NT$1,800 免運</span>
</div>

<div id="pg-shop" class="page active">
  <div class="body-wrap">
    <div class="sb">
      <div class="aci on" id="aci" onclick="sc('all')">
        <span style="font-size:16px;">◈</span><span>全部</span>
      </div>
      <div class="gh" onclick="tg('type')"><span class="gt">類型</span><span class="ga" id="a-type">▾</span></div>
      <div class="gi" id="g-type" style="max-height:0;"></div>
      <div class="gh" onclick="tg('brand')"><span class="gt">品牌</span><span class="ga" id="a-brand">▾</span></div>
      <div class="gi" id="g-brand" style="max-height:0;"></div>
    </div>
    <div class="right-area">
      <span class="albl" id="albl">ALL ITEMS</span>
      <div class="grid" id="grid"></div>
      <div class="pagination" id="pagination" style="display:none;flex-wrap:wrap;gap:6px;"></div>
    </div>
  </div>
</div>

<div id="pg-detail" class="page">
  <div class="dim" id="dim"></div>
  <div class="dbody">
    <button class="back" onclick="gp('shop')">← 返回</button>
    <div class="dbr" id="dbr"></div>
    <div class="dnm" id="dnm"></div>
    <div class="dag" id="dag"></div>
    <div class="dpr" id="dpr"></div>
    <span class="szlbl">選擇尺寸</span>
    <div class="szs" id="dszs"></div>
    <div class="sz-desc" id="sz-desc"></div>
    <span class="clbl" id="clbl" style="display:none;">選擇顏色</span>
    <div class="cls" id="dcls"></div>
    <button class="btnm" onclick="addCart()">加入購物車</button>
    <button class="bto" onclick="gp('shop')">繼續選購</button>
  </div>
</div>

<div id="pg-cart" class="page">
  <div class="wp">
    <button class="back" onclick="gp('shop')">← 繼續選購</button>
    <div class="ptit">購物車</div>
    <div id="citems"></div>
    <div id="cfoot" style="display:none;">
      <div id="sind"></div>
      <div class="cbox" id="csum"></div>
      <button class="btnm" onclick="gp('confirm')">前往結帳 →</button>
    </div>
    <div id="cempty" style="text-align:center;padding:3rem 1rem;font-size:12px;color:var(--tx3);">購物車是空的</div>
  </div>
</div>

<div id="pg-confirm" class="page">
  <div class="wp">
    <button class="back" onclick="gp('cart')">← 返回購物車</button>
    <div class="ptit">確認訂單</div>
    <div class="osum" id="cfsum"></div>
    <button class="btnm" onclick="gp('form')">確定結帳 →</button>
    <button class="bto" onclick="gp('cart')">修改購物車</button>
  </div>
</div>

<div id="pg-form" class="page">
  <div class="wp">
    <button class="back" onclick="gp('confirm')">← 返回</button>
    <div class="ptit">填寫資料</div>
    <div style="background:linear-gradient(135deg,#FDF0E8,#F7E8DC);border:1.5px solid #C9947F;border-radius:14px;padding:20px;margin-bottom:16px;">
      <p style="font-size:13px;font-weight:700;color:#9B6350;margin-bottom:16px;">💳 匯款帳號</p>
      <table style="width:100%;border-collapse:collapse;">
        <tr style="border-bottom:1px dashed #E8C4BB;">
          <td style="font-size:12px;color:#A88B7A;padding:8px 0;">銀行</td>
          <td style="font-size:14px;font-weight:700;color:#3E2A1E;text-align:right;padding:8px 0;">台新銀行(812)</td>
        </tr>
        <tr>
          <td style="font-size:12px;color:#A88B7A;padding:8px 0;">帳號</td>
          <td style="font-size:14px;font-weight:700;color:#3E2A1E;text-align:right;padding:8px 0;">28881009304598</td>
        </tr>
      </table>
      <p style="font-size:11px;color:#9B6350;text-align:center;border-top:1px dashed #C9947F;padding-top:12px;margin-top:8px;">⚠️ 請於 3 日內完成匯款<br>匯款後請截圖傳給我們確認</p>
    </div>
    <div class="fg"><label class="fl">收件人姓名</label><input id="fn" placeholder="請輸入姓名"/></div>
    <div class="fg"><label class="fl">IG 帳號</label><input id="fig" placeholder="@your_instagram"/></div>
    <div class="fg"><label class="fl">手機號碼</label><input id="fp" type="tel" placeholder="09xx-xxx-xxx"/></div>
    <div class="fg"><label class="fl">7-ELEVEN 取貨門市</label><input id="fs" placeholder="例：台北忠孝門市"/></div>
    <div class="fg">
      <label class="fl">折扣碼 <span class="opt-lbl">（選填）</span></label>
      <div style="display:flex;gap:8px;">
        <input id="fdisc" placeholder="輸入折扣碼" style="flex:1;"/>
        <button type="button" onclick="applyDiscountCode()" style="border:1px solid var(--bd2);border-radius:8px;padding:0 16px;font-size:12px;background:transparent;color:var(--tx2);cursor:pointer;white-space:nowrap;">套用</button>
      </div>
      <div id="disc-msg" style="font-size:11px;margin-top:6px;"></div>
    </div>
    <div class="fg">
      <label class="fl">親子裝優惠碼 <span class="opt-lbl">（選填）</span></label>
      <div style="display:flex;gap:8px;">
        <input id="ffam" placeholder="輸入折扣碼" style="flex:1;"/>
        <button type="button" onclick="applyFamilyCode()" style="border:1px solid var(--bd2);border-radius:8px;padding:0 16px;font-size:12px;background:transparent;color:var(--tx2);cursor:pointer;white-space:nowrap;">套用</button>
      </div>
      <div id="fam-msg" style="font-size:11px;margin-top:6px;"></div>
    </div>
    <div class="osum" id="fsum"></div>
    <button class="btnm" id="submit-btn" onclick="submitOrder()">確認下單 →</button>
  </div>
</div>

<div id="pg-ok" class="page">
  <div class="swp">
    <div class="sln"></div>
    <div class="sic">✅</div>
    <div class="sti">訂單已送出</div>
    <div class="ssu">請於 3 日內完成匯款<br>匯款後請截圖傳給我們確認<br>確認後將盡快為您出貨</div>
    <div class="sno" id="sno"></div>
    <button class="btnm" style="max-width:200px;margin:0 auto;display:block;" onclick="gp('shop')">繼續選購</button>
  </div>
</div>

function sp(p){return p.isNew?Math.round(p.price*DISC):p.price;}
function familyEligible(brand){
  const hasAdult=cart.some(c=>c.brand===brand&&(c.size||'').toLowerCase()==='free');
  const hasChild=cart.some(c=>c.brand===brand&&(c.size||'').toLowerCase()!=='free');
  return hasAdult&&hasChild;
}
function calc(){
  const sub=cart.reduce((a,c)=>a+sp(c)*c.qty,0);
  const disc=cart.reduce((a,c)=>c.isNew?a+Math.round(c.price*c.qty-sp(c)*c.qty):a,0);
  const familyDisc=(familyApplied&&familyEntry&&familyEligible(familyEntry.brand))?familyEntry.disc:0;
  const ship=(appliedCode||sub>=SFREE)?0:SFEE;
  return{sub,disc,familyDisc,ship,total:Math.max(0,sub+ship-familyDisc)};
}
function usedCodes(){try{return JSON.parse(localStorage.getItem('usedDiscCodes')||'[]');}catch(e){return[];}}
function markCodeUsed(code){const u=usedCodes();if(!u.includes(code)){u.push(code);localStorage.setItem('usedDiscCodes',JSON.stringify(u));}}
function applyDiscountCode(){
  const input=document.getElementById('fdisc'),msg=document.getElementById('disc-msg');
  const code=input.value.trim().toUpperCase();
  if(!code){appliedCode=null;msg.textContent='';document.getElementById('fsum').innerHTML=sumHTML();return;}
  if(!DISC_CODES.includes(code)){appliedCode=null;msg.textContent='❌ 折扣碼無效';msg.style.color='var(--tx3)';}
  else if(usedCodes().includes(code)){appliedCode=null;msg.textContent='⚠️ 此折扣碼已使用過';msg.style.color='var(--tx3)';}
  else{appliedCode=code;msg.textContent='✅ 折扣碼套用成功，本次訂單免運！';msg.style.color='var(--gn)';}
  document.getElementById('fsum').innerHTML=sumHTML();
}
function applyFamilyCode(){
  const input=document.getElementById('ffam'),msg=document.getElementById('fam-msg');
  const code=input.value.trim().toUpperCase();
  if(!code){familyApplied=false;familyEntry=null;msg.textContent='';document.getElementById('fsum').innerHTML=sumHTML();return;}
  const entry=FAMILY_DISCOUNTS.find(f=>f.code===code);
  if(!entry){familyApplied=false;familyEntry=null;msg.textContent='❌ 折扣碼無效';msg.style.color='var(--tx3)';}
  else if(!familyEligible(entry.brand)){familyApplied=false;familyEntry=entry;msg.textContent='⚠️ 此優惠僅限同筆訂單同時購買 '+entry.brand+' 大人＋小孩款式';msg.style.color='var(--tx3)';}
  else{familyApplied=true;familyEntry=entry;msg.textContent='✅ 折扣碼套用成功，折抵 NT$'+entry.disc;msg.style.color='var(--gn)';}
  document.getElementById('fsum').innerHTML=sumHTML();
}

function buildSidebar(){
  const types=[...new Set(P.map(p=>p.type))].filter(Boolean).sort();
  const brands=[...new Set(P.map(p=>p.brand))].filter(Boolean).sort();
  document.getElementById('g-type').innerHTML=types.map(t=>`<div class="ci" onclick="sc('type:${t}',this)"><span class="ci-l" style="font-size:10px;padding:2px 0;">${t}</span></div>`).join('');
  document.getElementById('g-brand').innerHTML=brands.map(b=>`<div class="ci" onclick="sc('brand:${b}',this)"><span class="ci-l" style="font-size:9px;">${b}</span></div>`).join('');
}

function tg(k){const gs=document.getElementById('g-'+k);const isOpen=gs.style.maxHeight!=='0px'&&gs.style.maxHeight!=='';gs.style.maxHeight=isOpen?'0':'400px';document.getElementById('a-'+k).classList.toggle('open',!isOpen);}
function ca(){document.getElementById('aci').classList.remove('on');document.querySelectorAll('.ci').forEach(i=>i.classList.remove('on'));}
function sc(c,el){cat=c;curPage=1;ca();if(c==='all')document.getElementById('aci').classList.add('on');else if(el)el.classList.add('on');document.getElementById('albl').textContent=c==='all'?'ALL ITEMS':c.split(':')[1];rg();gp('shop');}
function gl(){return P.filter(p=>{if(cat==='all')return true;const[t,v]=cat.split(':');if(t==='type')return p.type===v;if(t==='brand')return p.brand===v;return true;});}

function rg(){
  const g=document.getElementById('grid');
  const l=[...gl()].reverse(); // 最新商品在前
  if(!l.length){g.innerHTML='<div class="empty">此分類暫無商品</div>';document.getElementById('pagination').style.display='none';return;}
  const totalPages=Math.ceil(l.length/PAGE_SIZE);
  if(curPage>totalPages)curPage=1;
  const items=l.slice((curPage-1)*PAGE_SIZE,curPage*PAGE_SIZE);
  g.innerHTML=items.map(p=>{
    const discHTML=p.isNew?'<span class="cpr-o">NT$ '+p.price+'</span>':'';
    return '<div class="card" onclick="od('+p.id+')">'
      +'<div class="cimg">'
      +(p.isNew?'<span class="ntag">新品 95折</span>':'')
      +'<img src="'+p.imgs[0]+'" loading="lazy" onerror="this.style.display=\'none\'" />'
      +'</div>'
      +'<div class="cb">'
      +'<div class="cbr">'+p.brand+'</div>'
      +'<div class="cnm">'+p.name+'</div>'
      +'<div class="cpr">'
      +'<span class="cpr-n">NT$ '+sp(p)+'</span>'
      +discHTML
      +'</div>'
      +'</div>'
      +'</div>';
  }).join('');

  // 頁碼 1 2 3 ... 8
  const pgEl=document.getElementById('pagination');
  if(totalPages>1){
    pgEl.style.display='flex';
    let pgHTML='';
    for(let i=1;i<=totalPages;i++){
      if(
        i===1 || 
        i===totalPages || 
        (i>=curPage-1 && i<=curPage+1)
      ){
        pgHTML+=`<button class="pg-btn ${i===curPage?'pg-active':''}" onclick="goPage(${i})">${i}</button>`;
      } else if(i===2 && curPage>4){
        pgHTML+=`<span style="color:var(--tx3);padding:0 2px;">...</span>`;
      } else if(i===totalPages-1 && curPage<totalPages-3){
        pgHTML+=`<span style="color:var(--tx3);padding:0 2px;">...</span>`;
      }
    }
    pgEl.innerHTML=pgHTML;
  } else {
    pgEl.style.display='none';
  }
}

function changePage(d){curPage+=d;rg();window.scrollTo(0,0);}
function goPage(n){curPage=n;rg();window.scrollTo(0,0);}

function od(id){
  cur=P.find(x=>x.id===id);sz=null;cl=null;curImgs=cur.imgs||[];curImgIdx=0;
  document.getElementById('dbr').textContent=cur.brand;
  document.getElementById('dnm').textContent=cur.name;
  document.getElementById('dag').textContent='';
  document.getElementById('dpr').innerHTML=`<span class="dpr-n">NT$ ${sp(cur)}</span>${cur.isNew?`<span class="dpr-o">NT$ ${cur.price}</span><span class="dpr-tag">新品 95折</span>`:''}`;
  document.getElementById('dszs').innerHTML=cur.sizes.map(s=>`<span class="sz" onclick="ps('${s}',this)">${s}</span>`).join('');
  const sd=document.getElementById('sz-desc');
  sd.innerHTML=cur.sizeDescs&&cur.sizeDescs.length?cur.sizeDescs.join('<br>'):'';
  sd.style.display=cur.sizeDescs&&cur.sizeDescs.length?'block':'none';
  const clbl=document.getElementById('clbl');
  const clsEl=document.getElementById('dcls');
  if(cur.colors&&cur.colors.length){clbl.style.display='block';clsEl.innerHTML=cur.colors.map(c=>`<span class="cl" onclick="pc('${c}',this)">${c}</span>`).join('');}
  else{clbl.style.display='none';clsEl.innerHTML='';}
  renderDim();gp('detail');
}

function renderDim(){
  const d=document.getElementById('dim');
  const src=curImgs[curImgIdx]||'';
  d.innerHTML=(src?`<img src="${src}" style="width:100%;height:100%;object-fit:cover;" />`:'<span style="font-size:48px;opacity:0.2;">👗</span>')+
    (cur.isNew?'<div class="dnb">新品上市</div>':'')+
    (curImgs.length>1?`<button class="img-nav prev" onclick="chImg(-1)">‹</button><button class="img-nav next" onclick="chImg(1)">›</button><div class="img-dots">${curImgs.map((_,i)=>`<button class="img-dot ${i===curImgIdx?'on':''}" onclick="goImg(${i})"></button>`).join('')}</div>`:'');
}
function chImg(d){curImgIdx=(curImgIdx+d+curImgs.length)%curImgs.length;renderDim();}
function goImg(i){curImgIdx=i;renderDim();}
function ps(s,el){sz=s;document.querySelectorAll('#dszs .sz').forEach(x=>x.classList.remove('on'));el.classList.add('on');}
function pc(c,el){cl=c;document.querySelectorAll('#dcls .cl').forEach(x=>x.classList.remove('on'));el.classList.add('on');}

function addCart(){
  if(!sz){alert('請先選擇尺寸');return;}
  if(cur.colors&&cur.colors.length>0&&!cl){alert('請先選擇顏色');return;}
  const key=cur.id+'_'+sz+'_'+(cl||'');
  const ex=cart.find(c=>c.key===key);
  if(ex)ex.qty++;else cart.push({...cur,size:sz,color:cl||'',key,qty:1});
  document.getElementById('cnt').textContent=cart.reduce((a,c)=>a+c.qty,0);
  gp('cart');
}

function rc(){
  const el=document.getElementById('citems'),ft=document.getElementById('cfoot'),em=document.getElementById('cempty');
  if(!cart.length){el.innerHTML='';ft.style.display='none';em.style.display='block';return;}
  em.style.display='none';ft.style.display='block';
  const{sub,disc,ship,total}=calc();
  document.getElementById('sind').innerHTML=sub>=SFREE?`<div class="ship-ok">🚚 已達免運門檻！</div>`:`<div class="ship-no"><span>再買 <b style="color:var(--pk3);">NT$${SFREE-sub}</b> 免運</span><div class="spbar"><div class="spfill" style="width:${Math.min(100,Math.round(sub/SFREE*100))}%;"></div></div>🚚</div>`;
  document.getElementById('csum').innerHTML=cart.map(c=>`<div class="crow"><span>${c.name}(${c.size}${c.color?'/'+c.color:''})×${c.qty}</span><span style="color:var(--pk3);">NT$${(sp(c)*c.qty).toLocaleString()}</span></div>`).join('')+`<div class="cdiv"></div><div class="csub"><span style="color:var(--tx3);">小計</span><span>NT$${sub.toLocaleString()}</span></div>`+(disc?`<div class="csub"><span style="color:var(--gn);">🏷新品95折</span><span style="color:var(--gn);">－NT$${disc.toLocaleString()}</span></div>`:'')+`<div class="csub"><span style="color:var(--tx3);">運費</span><span style="color:${ship===0?'var(--gn)':'var(--tx3)'};">${ship===0?'🎉免運':'NT$'+ship}</span></div><div class="ctot"><span>總金額</span><span class="ctot-a">NT$${total.toLocaleString()}</span></div>`;
  el.innerHTML=cart.map((c,i)=>`<div class="citem"><div class="ci-img"><img src="${c.imgs[0]}" style="width:100%;height:100%;object-fit:cover;" /></div><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:var(--br2);margin-bottom:2px;">${c.name}</div><div style="font-size:10px;color:var(--tx3);margin-bottom:4px;">${c.brand}・${c.size}${c.color?'・'+c.color:''}・x${c.qty}</div><div style="font-size:13px;font-weight:600;color:var(--pk3);">NT$${(sp(c)*c.qty).toLocaleString()}</div></div><button style="background:none;border:none;color:var(--tx3);cursor:pointer;font-size:16px;" onclick="di(${i})">✕</button></div>`).join('');
}
function di(i){cart.splice(i,1);document.getElementById('cnt').textContent=cart.reduce((a,c)=>a+c.qty,0);rc();}

function sumHTML(){
  const{sub,disc,familyDisc,ship,total}=calc();
  return`<div class="ost">訂單明細</div>`+cart.map(c=>`<div class="osr"><span style="color:var(--tx2);">${c.name}(${c.size}${c.color?'/'+c.color:''})×${c.qty}${c.isNew?' 🏷95折':''}</span><span class="osa">NT$${(sp(c)*c.qty).toLocaleString()}</span></div>`).join('')+(disc?`<div class="osr"><span style="color:var(--gn);">折扣</span><span style="color:var(--gn);">－NT$${disc.toLocaleString()}</span></div>`:'')+(familyDisc?`<div class="osr"><span style="color:var(--gn);">親子裝優惠</span><span style="color:var(--gn);">－NT$${familyDisc.toLocaleString()}</span></div>`:'')+`<div class="osr"><span style="color:var(--tx3);">運費</span><span style="color:${ship===0?'var(--gn)':'var(--tx3)'};">${ship===0?'免運':'NT$'+ship}</span></div><div class="osr"><span>應付金額</span><span class="osa">NT$${total.toLocaleString()}</span></div>`;
}

function gp(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('pg-'+p).classList.add('active');window.scrollTo(0,0);if(p==='cart')rc();if(p==='confirm')document.getElementById('cfsum').innerHTML=sumHTML();if(p==='form')document.getElementById('fsum').innerHTML=sumHTML();}

async function submitOrder(){
  const name=document.getElementById('fn').value.trim();
  const ig=document.getElementById('fig').value.trim();
  const phone=document.getElementById('fp').value.trim();
  const store=document.getElementById('fs').value.trim();
  if(!name||!ig||!phone||!store){alert('請填寫姓名、IG帳號、手機、取貨門市');return;}
  const{total,familyDisc}=calc();
  const itemsStr=cart.map(c=>`${c.name}(${c.size}${c.color?'/'+c.color:''})×${c.qty}`).join('、');
  const discountCode=appliedCode||'';
  const familyCode=familyDisc?(familyEntry?familyEntry.code:''):'';
  const btn=document.getElementById('submit-btn');
  btn.textContent='送出中...';btn.disabled=true;
  try{
    const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'addOrder',name,ig,phone,store,items:itemsStr,total,discountCode,familyCode,familyDisc})});
    const data=await res.json();
    if(data.success){
      if(appliedCode)markCodeUsed(appliedCode);
      appliedCode=null;familyApplied=false;familyEntry=null;
      document.getElementById('sno').textContent='訂單編號 '+data.orderNo;cart=[];document.getElementById('cnt').textContent=0;
      ['fn','fig','fp','fs','fdisc','ffam'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('disc-msg').textContent='';
      document.getElementById('fam-msg').textContent='';
      gp('ok');
    }
    else alert('送出失敗，請再試一次');
  }catch(e){alert('網路錯誤，請再試一次');}
  btn.textContent='確認下單 →';btn.disabled=false;
}

// 頁面載入完成後立即執行
buildSidebar();
rg();
</script>
</body>
</html>
